resources:
  jobs:
    execução_vcredit_4_em_4_horas:
      name: Execução Vcredit (4 em 4 horas)
      tasks:
        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/Bronze_to_Silver.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: analise_motivos_canais
          depends_on:
            - task_key: bronze_to_silver
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/Analise_dim_Motivos_Canais_Samuel.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: landing_to_bronze
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/Landing_to_Bronze.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/Silver_to_Gold.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 4
          unit: HOURS
      webhook_notifications: {}
