
resources:
  jobs:
    execucao_vcredit_4_em_4_horas:
      name: Execução Vcredit (4 em 4 horas)

      tasks:
        - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../src/Landing_to_Bronze.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: bronze_to_silver
          depends_on:
            - task_key: landing_to_bronze
          notebook_task:
            notebook_path: ../src/Bronze_to_Silver.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          notebook_task:
            notebook_path: ../src/Silver_to_Gold.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: analises_gold_views
          depends_on:
            - task_key: silver_to_gold
          notebook_task:
            notebook_path: ../src/Analises_Gold.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: tratamento_e_validacao
          depends_on:
            - task_key: analises_gold_views
            - task_key: silver_to_gold
          notebook_task:
            notebook_path: ../src/tratamento_e_validacao_tempos.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

        - task_key: exportacao_dados
          depends_on:
            - task_key: analises_gold_views
            - task_key: silver_to_gold
            - task_key: tratamento_e_validacao
          notebook_task:
            notebook_path: ../src/Exportacao_Dados.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0

      email_notifications:
        no_alert_for_skipped_runs: false

      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED

      queue:
        enabled: true

      timeout_seconds: 0

      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 4
          unit: HOURS

      webhook_notifications: {}